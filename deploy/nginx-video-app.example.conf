# =============================================================================
# nginx — video app (Next.js + Socket.io SFU)
# =============================================================================
#
# 1) WebSocket fix (required for Socket.io — put INSIDE `http { }` in
#    /etc/nginx/nginx.conf, BEFORE any `include sites-enabled` lines):
#
#    map $http_upgrade $connection_upgrade {
#        default upgrade;
#        ''      close;
#    }
#
#    Then use `proxy_set_header Connection $connection_upgrade;` below (not the
#    literal "upgrade" for every request — that breaks long-polling and can
#    prevent WSS from working reliably).
#
# 2) After edits: `sudo nginx -t && sudo systemctl reload nginx`
#
# 3) Same machine, one hostname (recommended): use ONE `server_name`, set
#    NEXT_PUBLIC_SOCKET_URL=https://that-same-host  (no separate SFU subdomain).
#
# 4) SFU on a subdomain (e.g. sfu.aspirantsgoal.com): see
#    deploy/nginx-sfu-subdomain.example.conf — you need a cert for that host and
#    CORS_ORIGIN on the Node SFU must list your *frontend* origin(s), e.g.
#    CORS_ORIGIN=https://aspirantsgoal.com,https://www.aspirantsgoal.com
#
# =============================================================================

upstream video_app_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream video_app_sfu {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet.example.com;

    ssl_certificate     /etc/letsencrypt/live/meet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.example.com/privkey.pem;

    # Socket.io — requires $connection_upgrade (see map in nginx.conf http{})
    location /socket.io/ {
        proxy_pass http://video_app_sfu;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /sfu-health {
        proxy_pass http://video_app_sfu/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://video_app_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}

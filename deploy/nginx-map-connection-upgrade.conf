# Paste into /etc/nginx/nginx.conf inside the http { } block, BEFORE any server {}
# blocks (or save as /etc/nginx/snippets/websocket-upgrade-map.conf and add:
#   include /etc/nginx/snippets/websocket-upgrade-map.conf;
#
# Without this map, proxy_set_header Connection $connection_upgrade sends an
# empty or wrong Connection header and wss:// (Socket.IO WebSocket) fails in the browser.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

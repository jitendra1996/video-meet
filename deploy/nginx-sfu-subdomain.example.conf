# =============================================================================
# nginx — SFU only on https://sfu.example.com  (Next.js hosted elsewhere)
# =============================================================================
#
# REQUIRES map in http{} — use deploy/nginx-map-connection-upgrade.conf (nginx -T to verify).
# If this map is missing, browsers show: WebSocket connection to wss://.../socket.io/ failed
#
# TLS: cert must include this exact hostname, e.g.:
#   certbot certonly --nginx -d sfu.aspirantsgoal.com
#
# PM2 env on the SFU process (critical for cross-subdomain):
#   CORS_ORIGIN=https://aspirantsgoal.com,https://www.aspirantsgoal.com
# Use every origin where users load your Next.js app (no trailing slashes).
#
# Frontend build:
#   NEXT_PUBLIC_SOCKET_URL=https://sfu.aspirantsgoal.com
#
# Firewall: allow UDP+TCP for WEBRTC_PORT_MIN–MAX (e.g. 40000–49999), not ~101 ports.
#
# Verify before PM2:
#   curl -sI https://sfu.aspirantsgoal.com/socket.io/?EIO=4\&transport=polling | head -5
#   (expect 400 or 200 from engine.io, not 502)
#
# If you use Cloudflare: set SSL mode Full (strict), enable WebSockets.
# =============================================================================

upstream video_app_sfu {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name sfu.aspirantsgoal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sfu.aspirantsgoal.com;

    ssl_certificate     /etc/letsencrypt/live/sfu.aspirantsgoal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfu.aspirantsgoal.com/privkey.pem;

    # Prefix match: /socket.io, /socket.io/, and query string (?EIO=4&transport=websocket)
    location /socket.io {
        proxy_pass http://video_app_sfu;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    location = /health {
        proxy_pass http://video_app_sfu/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
